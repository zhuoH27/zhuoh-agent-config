name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest python-pptx
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Audit gate
        run: python scripts/agent_sync.py audit
