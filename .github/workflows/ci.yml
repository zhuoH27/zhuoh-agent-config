name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest tests/ -q --tb=long -rA 2>&1 | Tee-Object -FilePath pytest-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## pytest output"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content -Raw pytest-output.txt)
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            }
            # 失败信息提升为公开可见的 annotation：每条关键行单独一条，避免单条截断吃掉细节
            $key = (Select-String -Path pytest-output.txt -Pattern 'FAILED|AssertionError|diag|已最新|写入|备份|未检测到|Skill|跳过|error' | Select-Object -First 40)
            foreach ($k in $key) {
              $line = $k.Line
              if ($line.Length -gt 350) { $line = $line.Substring(0, 350) }
              Write-Host "::error::$line"
            }
          }
          exit $code
      - name: Upload pytest output (failure diagnosis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: pytest-output.txt
      - name: Audit gate (3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/agent_sync.py audit
      - name: Release consistency hint
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python scripts/check_release.py
